
name: CoffeeNChill CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build API Gateway
        run: dotnet build CoffeeNChill.Gateway/CoffeeNChill.Gateway.csproj --configuration Release

      - name: Build Backend if available
        run: |
          if [ -f CoffeeNChill/CoffeeNChill.csproj ]; then
            dotnet build CoffeeNChill/CoffeeNChill.csproj --configuration Release
          else
            echo "::warning::Backend source is missing from the repository."
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.gateway
          push: true
          tags: disantejade154362/coffeenchill-gateway:part3

      - name: Build and push Backend if available
        run: |
          if [ -f CoffeeNChill/CoffeeNChill.csproj ] && [ -f Dockerfile ]; then
            docker build -f Dockerfile -t disantejade154362/coffeenchill-backend:part3 .
            docker push disantejade154362/coffeenchill-backend:part3
          else
            echo "::warning::Backend build skipped because source or Dockerfile is missing."
          fi
