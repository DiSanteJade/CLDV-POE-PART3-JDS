services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command:
      - azurite
      - --location
      - /data
      - --blobHost
      - 0.0.0.0
      - --queueHost
      - 0.0.0.0
      - --tableHost
      - 0.0.0.0
    volumes:
      - azurite-data:/data

  backend:
    image: coffeenchill-backend:local
    environment:
      FUNCTIONS_WORKER_RUNTIME: dotnet
      FUNCTIONS_INPROC_NET8_ENABLED: "1"
      AzureWebJobsSecretStorageType: files
      AzureWebJobsStorage: ${AZURITE_STORAGE:?Storage required}
    depends_on:
      - azurite

  gateway:
    image: coffeenchill-gateway:local
    ports:
      - "127.0.0.1:5228:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Storage__ConnectionString: ${AZURITE_STORAGE:?Storage required}
      Jwt__Key: ${JWT_SIGNING_KEY:?JWT key required}
      Jwt__Issuer: CoffeeNChill.Gateway
      Jwt__Audience: CoffeeNChill.Clients
      ReverseProxy__Clusters__coffeeCluster__Destinations__coffeeBackend__Address: http://backend:80/
    depends_on:
      - backend

volumes:
  azurite-data:
